<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="public/favicon.ico" />
    <title>Vahid Asghari's Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>


    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar Container -->
        <div class="sidebar-container"></div>

        <!-- Main Content -->
        <div class="col-lg-9 col-md-8 main-content">
          <div class="content-wrapper p-4">
            <!-- Quant Notebooks Section -->
            <section id="quant" class="mb-5">
              <div class="section-header d-flex align-items-center mb-4">
                <div class="section-icon me-3">
                  <i class="bi bi-journal-text text-primary fs-1"></i>
                </div>
                <div>
                  <h2 class="h3 fw-bold mb-1">Quant Notebooks</h2>
                  <p class="text-muted mb-0">Quantitative analysis and trading strategies</p>
                </div>
              </div>
              <div class="row g-3" id="quant-notebooks">
                <!-- Content will be populated by JavaScript -->
              </div>
            </section>

            <!-- Projects Section -->
            <section id="projects-section" class="mb-5">
              <div class="section-header d-flex align-items-center mb-4">
                <div class="section-icon me-3">
                  <i class="bi bi-code-square text-success fs-1"></i>
                </div>
                <div>
                  <h2 class="h3 fw-bold mb-1">Projects</h2>
                  <p class="text-muted mb-0">Software and research projects</p>
                </div>
              </div>
              <div class="row g-3" id="projects">
                <!-- Content will be populated by JavaScript -->
              </div>
            </section>

            <!-- Research Papers Section -->
            <section id="papers" class="mb-5">
              <div class="section-header d-flex align-items-center mb-4">
                <div class="section-icon me-3">
                  <i class="bi bi-book text-info fs-1"></i>
                </div>
                <div>
                  <h2 class="h3 fw-bold mb-1">Research Papers</h2>
                  <p class="text-muted mb-0">Academic publications and research</p>
                </div>
              </div>
              <div class="row g-3" id="research-papers">
                <!-- Content will be populated by JavaScript -->
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="data/content.js"></script>
    <script src="components/content-cards.js"></script>
  </body>
</html>
